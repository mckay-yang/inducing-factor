[workspace]
members = [
    "crates/if-core",
    "crates/if-loaders",
    "crates/if-pipeline",
    "crates/if-config",
    "crates/if-io",
    "crates/if-cli",
    "crates/if-tests",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["McKay"]

[workspace.dependencies]
# ── Core numeric / ML ──
ndarray = "0.16"
rand = "0.8"

# ── Serialization ──
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# ── Error handling ──
thiserror = "2.0"

# ── Geo / GIS ──
gdal = "0.15"
netcdf = "0.9"
geo = "0.28"
rstar = "0.12"

# ── Data processing ──
polars = { version = "0.45", features = ["lazy", "ndarray", "parquet"] }
rayon = "1.10"
crossbeam = "0.8"

# ── Config ──
config = { version = "0.14", features = ["yaml"] }

# ── CLI ──
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.17"

# ── System ──
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

# ── Testing ──
tempfile = "3"
