[package]
name = "cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "cli"
path = "src/main.rs"

[dependencies]
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
indicatif.workspace = true

workflow-config = { path = "../workflow-config" }
data-process = { path = "../data-process" }
train = { path = "../train" }
predict = { path = "../predict" }
gdal = { path = "../gdal" }

gdal_crate = { package = "gdal", version = "0.19", optional = true }

[features]
default = ["gdal"]
gdal = ["dep:gdal_crate"]

[dev-dependencies]
tempfile.workspace = true
