# Production configuration using a clean cache/output location.

paths:
  cache_dir: "data/cache/chunks"
  out_dir: "data/result/models"

pipeline:
  start_year: 1990
  end_year: 2020
  chunk_size: 1024
  num_workers: 0
  max_auto_workers: 4
  memory_target_fraction: 0.7
  estimated_worker_gb: 3.0

attribution:
  lookback_years: 3
  background_sample_rate: 0.05
  discretizer_method: "supervised_tree"
  discretize_bins: 3
  max_pattern_size: 3
  min_support: 0.05
  min_relative_risk: 1.5
  bootstrap_iterations: 10
  min_stability: 0.6
  max_bootstrap_samples: 3000
  max_network_factors: 6
  dominant_threshold: 0.55
  synergy_threshold: 0.75
  random_state: 42
  run_num_workers: 0
  run_max_auto_workers: 2
  run_memory_target_fraction: 0.7
  run_estimated_worker_gb: 1.5
  predict_num_workers: 0
  predict_max_auto_workers: 4
  predict_memory_target_fraction: 0.7
  predict_estimated_worker_gb: 1.0

data_sources:
  aoi_shp: "data/input/aoi/LangToBasighat.shp"
  dem_tif: "data/input/dem/tibet_dem.tif"
  landuse_dir: "data/input/landuse"
  rainfall_dir: "data/input/rainfall"
  temperature_dir: "data/input/temperature"
  resident_dir: "data/input/resident"
  river_shp_dir: "data/input/river"
  road_shp_dir: "data/input/road"
  ccdc_dir: "data/input/ccdc_res"
  disturbance_class_tif: "data/input/disturbance_class/disturbance_class_res.tif"
  landuse_file_pattern: "CLCD_v01_{year}_albert_province/CLCD_v01_{year}_albert_xizang.tif"
  road_file_pattern: "osm_{year}_roads.shp"
  railway_file_pattern: "osm_{year}_railways.shp"
  waterway_file_pattern: "osm_{year}_waterways.shp"
  rainfall_monthly_file_pattern: "pre{year}{month:02d}.tif"
  temperature_file_pattern: "tmp_{year}.nc"
  resident_file_pattern: "GURS_{year}.tif"
  ccdc_file_pattern: "{year}.tif"
  disturbance_class_start_year: 2016
  dem_nodata: -9999.0
  resident_nodata: 127.0
