# Full-extent analysis configuration.

paths:
  aoi_shp: "data/aoi/LangToBasighat.shp"
  dem_tif: "data/dem/tibet_dem.tif"
  road_shp: "data/road"
  resident_shp: "data/resident"
  ccdc_dir: "data/ccdc_res"
  rainfall_dir: "data/rainfall"
  temperature_dir: "data/temperature"
  output_dir: "data/.cache/output_model_full_extent"

time_series:
  start_year: 2015
  end_year: 2025
  climatology_baseline_years: 5

processing:
  chunk_size: 1024
  mask_nodata: true

clustering:
  method: "gmm"
  n_clusters: 5

bayesian_network:
  discretize_bins: 3
  discretize_strategy: "quantile"
